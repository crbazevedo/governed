[project]
name = "governed-agents"
version = "0.1.0"
description = "Governed autonomy middleware for AI agent systems"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "Carlos R. B. Azevedo", email = "renatoaz@gmail.com"}]
keywords = ["ai", "agents", "governance", "autonomy", "oversight", "hitl", "pii", "vt-tiers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://crbazevedo.github.io/governed/"
Documentation = "https://crbazevedo.github.io/governed/"
Repository = "https://github.com/crbazevedo/governed"
Issues = "https://github.com/crbazevedo/governed/issues"
Changelog = "https://github.com/crbazevedo/governed/blob/main/CHANGELOG.md"

[project.optional-dependencies]
amo = ["minimal-oversight>=0.1.0"]
presidio = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]
viz = ["rich>=13.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]
all = ["governed-agents[amo,viz,dev]"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
