# Multi-domain governance profile and pipeline configuration.
#
# This file defines personal and corporate governance domains with
# different VT floors, an information barrier, and a pipeline that
# enforces PII filtering, rate limiting, VT tier governance,
# budget controls, and audit logging.
#
# Single-domain usage:  load_pipeline_config("governance.toml")
# Multi-domain usage:   load_domain_config("governance.toml")

# ── Per-domain profiles ──────────────────────────────────

[domains.personal]
default_vt = 1
pii_sensitivity = 1

[domains.personal.vt_floor]
read_email = 0
send_email = 1
schedule = 0

[domains.corporate]
default_vt = 2
audit_required = true
pii_sensitivity = 2

[domains.corporate.vt_floor]
read_email = 1
search_docs = 1
send_email = 2
deploy = 3
delete_data = 4

[domains.corporate.blocked_tools]
tools = ["personal_calendar", "health_records", "personal_finance"]

# ── Cross-domain information barrier ─────────────────────

[barrier]
allowed_fields = ["timestamp", "duration_minutes", "urgency", "action_type"]

# ── Pipeline (shared across domains) ─────────────────────

[pipeline]
handlers = ["pii_filter", "rate_limiter", "vt_governance", "budget", "audit"]

[pipeline.rate_limiter]
max_per_window = 10
window_seconds = 60

[pipeline.budget]
limit_usd = 5.0

[pipeline.pii_filter]
redact = true
